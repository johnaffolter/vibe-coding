<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Dump Timer</title>
<style>
  :root { --bg:#faf7f2; --panel:#f2ede4; --ink:#2a2622; --muted:#7a736a; --line:#e2dbd0; --accent:#993c1d; --bar:#d85a30; }
  @media (prefers-color-scheme: dark) { :root { --bg:#171513; --panel:#201d1a; --ink:#ebe5dc; --muted:#a39b90; --line:#36312b; --accent:#f0997b; --bar:#d85a30; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; font:18px/1.6 Georgia, serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--line); font:14px/1.4 system-ui, sans-serif; }
  header h1 { font-size:16px; margin:0 auto 0 0; }
  select, button { font:inherit; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--bg); }
  .muted { color:var(--muted); }
  #clock { font-variant-numeric:tabular-nums; font-size:20px; min-width:64px; text-align:right; }
  .bar { height:4px; background:var(--line); } .bar i { display:block; height:100%; width:0; background:var(--bar); transition:width .3s linear; }
  .stage { flex:1; display:flex; min-height:0; }
  .write { flex:1; display:flex; flex-direction:column; min-width:0; }
  textarea { flex:1; width:100%; max-width:760px; margin:0 auto; padding:28px 16px 8px; border:0; outline:0; resize:none; background:transparent; color:var(--ink); font:inherit; transition:opacity 4s ease, filter 4s ease; }
  textarea.fading { opacity:0; filter:blur(4px); }
  .live { display:flex; justify-content:center; gap:18px; font:13px system-ui, sans-serif; color:var(--muted); padding:4px 16px; font-variant-numeric:tabular-nums; }
  #msg { text-align:center; font:14px system-ui, sans-serif; color:var(--muted); padding:4px 16px 14px; min-height:1.4em; }
  aside { width:320px; border-left:1px solid var(--line); background:var(--panel); font:14px/1.45 system-ui, sans-serif; display:flex; flex-direction:column; min-height:0; }
  aside[hidden] { display:none; }
  aside .head { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); }
  aside .totals { padding:10px 14px; color:var(--muted); border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  aside ol { list-style:none; margin:0; padding:0; overflow-y:auto; flex:1; }
  aside li { padding:10px 14px; border-bottom:1px solid var(--line); }
  aside li .meta { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:12px; }
  aside li p { margin:4px 0 6px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
  aside li button { font-size:12px; padding:2px 8px; margin-right:4px; }
  aside .foot { display:flex; gap:8px; flex-wrap:wrap; padding:10px 14px; border-top:1px solid var(--line); }
  .empty { padding:14px; color:var(--muted); }
  @media (max-width:760px) { .stage { flex-direction:column; } aside { width:auto; border-left:0; border-top:1px solid var(--line); max-height:45vh; } }
</style>
</head>
<body>
  <header>
    <h1>Brain dump timer</h1>
    <label for="mins" class="muted">Length</label>
    <select id="mins"><option>3</option><option selected>5</option><option>10</option><option>15</option></select>
    <label class="muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="keep" checked> Keep in history</label>
    <span id="clock">5:00</span>
    <button id="go" class="primary">Start</button>
    <button id="histBtn" aria-expanded="true" aria-controls="hist">History</button>
  </header>
  <div class="bar"><i id="fill"></i></div>
  <div class="stage">
    <div class="write">
      <textarea id="pad" placeholder="Press Start, then write whatever is in your head. Don't edit, don't stop. When time runs out it fades away so you can start fresh. A copy goes to your history unless you untick “Keep in history”." aria-label="Free-write area"></textarea>
      <div class="live"><span><b id="wc">0</b> words</span><span><b id="wpm">0</b> words/min</span></div>
      <div id="msg" aria-live="polite"></div>
    </div>
    <aside id="hist" aria-label="Session history">
      <div class="head"><strong>History</strong><span class="muted" id="hCount"></span></div>
      <div class="totals" id="totals"></div>
      <ol id="hList"></ol>
      <div class="foot">
        <button id="exportMd">Export all as Markdown</button>
        <button id="clearHist">Clear history</button>
      </div>
    </aside>
  </div>
<script>
const $ = id => document.getElementById(id);
const HK = "brain-dump-history";
let total = 300, left = 300, t = null, running = false, startedAt = null, elapsed = 0, history = [], confirmClear = false;
const show = s => $("clock").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const words = s => (s.trim().match(/\S+/g) || []).length;
const loadH = () => { try { history = JSON.parse(localStorage.getItem(HK) || "[]"); } catch (e) { history = []; } };
const saveH = () => { try { localStorage.setItem(HK, JSON.stringify(history)); } catch (e) {} };

function reset() {
  clearInterval(t); running = false; elapsed = 0;
  total = left = +$("mins").value * 60; show(left);
  $("fill").style.width = "0"; $("go").textContent = "Start"; document.title = "Brain Dump Timer";
  updateLive();
}
function updateLive() {
  const w = words($("pad").value); $("wc").textContent = w;
  $("wpm").textContent = elapsed > 5 ? Math.round(w / (elapsed / 60)) : 0;
}
function tick() {
  left--; elapsed++; show(left); updateLive();
  document.title = $("clock").textContent + " · Brain dump";
  $("fill").style.width = (100 * (total - left) / total) + "%";
  if (left <= 0) finish();
}
function finish() {
  clearInterval(t); running = false;
  const text = $("pad").value.trim();
  if ($("keep").checked && text) {
    history.unshift({ at: startedAt || new Date().toISOString(), minutes: Math.round(total / 60), words: words(text), text });
    saveH(); renderHist();
  }
  $("pad").classList.add("fading");
  $("msg").textContent = $("keep").checked && text ? "Saved to history. Letting it go…" : "Time. Letting it go…";
  setTimeout(() => {
    $("pad").value = ""; $("pad").classList.remove("fading");
    $("msg").textContent = "Clear head. Start again whenever you like.";
    startedAt = null; reset();
  }, 4000);
}
const fmtDate = s => new Date(s).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
function renderHist() {
  const ol = $("hList"); ol.innerHTML = "";
  $("hCount").textContent = history.length ? history.length + " session" + (history.length > 1 ? "s" : "") : "";
  const tw = history.reduce((a, h) => a + h.words, 0), tm = history.reduce((a, h) => a + h.minutes, 0);
  const days = new Set(history.map(h => h.at.slice(0, 10)));
  let streak = 0; for (let d = new Date(); ; d.setDate(d.getDate() - 1)) { const k = new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); if (days.has(k)) streak++; else break; }
  $("totals").textContent = history.length ? `${tw.toLocaleString()} words · ${tm} min written · ${streak}-day streak` : "Finished sessions show up here.";
  if (!history.length) { ol.innerHTML = '<li class="empty">No sessions yet.</li>'; return; }
  history.forEach((h, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<div class="meta"><span>${fmtDate(h.at)}</span><span>${h.words} words · ${h.minutes} min</span></div>`;
    const p = document.createElement("p"); p.textContent = h.text; li.append(p);
    const cp = document.createElement("button"); cp.textContent = "Copy";
    cp.onclick = async () => { try { await navigator.clipboard.writeText(h.text); cp.textContent = "Copied"; setTimeout(() => cp.textContent = "Copy", 1200); } catch (e) {} };
    const rm = document.createElement("button"); rm.textContent = "Delete";
    rm.onclick = () => { history.splice(i, 1); saveH(); renderHist(); };
    li.append(cp, rm); ol.append(li);
  });
}
function exportMd() {
  if (!history.length) return;
  const md = "# Brain dumps\n\n" + history.map(h => `## ${new Date(h.at).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" })}\n\n*${h.minutes} min · ${h.words} words*\n\n${h.text}\n`).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([md], { type: "text/markdown" }));
  a.download = "brain-dumps-" + new Date().toISOString().slice(0, 10) + ".md";
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$("go").onclick = () => {
  if (running) { clearInterval(t); running = false; $("go").textContent = "Resume"; return; }
  if (!startedAt) startedAt = new Date().toISOString();
  running = true; $("go").textContent = "Pause"; $("msg").textContent = ""; $("pad").focus();
  t = setInterval(tick, 1000);
};
$("pad").addEventListener("input", updateLive);
$("mins").onchange = () => { if (!running) reset(); };
$("histBtn").onclick = () => { const h = $("hist"); h.hidden = !h.hidden; $("histBtn").setAttribute("aria-expanded", !h.hidden); try { localStorage.setItem("brain-dump-hist-open", h.hidden ? "0" : "1"); } catch (e) {} };
$("exportMd").onclick = exportMd;
$("clearHist").onclick = () => {
  if (!history.length) return;
  if (!confirmClear) { confirmClear = true; $("clearHist").textContent = "Click again to clear"; setTimeout(() => { confirmClear = false; $("clearHist").textContent = "Clear history"; }, 3000); return; }
  history = []; saveH(); renderHist(); confirmClear = false; $("clearHist").textContent = "Clear history";
};
try {
  const k = localStorage.getItem("brain-dump-keep"); if (k !== null) $("keep").checked = k === "1";
  if (localStorage.getItem("brain-dump-hist-open") === "0") { $("hist").hidden = true; $("histBtn").setAttribute("aria-expanded", "false"); }
} catch (e) {}
$("keep").onchange = () => { try { localStorage.setItem("brain-dump-keep", $("keep").checked ? "1" : "0"); } catch (e) {} };
loadH(); renderHist(); reset();
</script>
</body>
</html>
